# Trust Render's proxy so REMOTE_ADDR is the real client IP
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Never serve these
<FilesMatch "^(wp-config\.php|\.htaccess|readme\.html|license\.txt|xmlrpc\.php)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/(docker|html|\.git)">
    Require all denied
</DirectoryMatch>
